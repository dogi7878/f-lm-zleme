openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: app
    description: Application capabilities
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /capabilities:
    get:
      operationId: getCapabilities
      tags: [app]
      summary: Get supported features and current limitations
      responses:
        "200":
          description: Supported app capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppCapabilities"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AppCapabilities:
      type: object
      properties:
        maxParticipants:
          type: integer
        supportedVideoSources:
          type: array
          items:
            type: string
        screenSharing:
          type: object
          properties:
            mobileSupported:
              type: boolean
            desktopSupported:
              type: boolean
            alternative:
              type: string
          required:
            - mobileSupported
            - desktopSupported
            - alternative
        roomPersistence:
          type: string
        voiceLimitations:
          type: string
      required:
        - maxParticipants
        - supportedVideoSources
        - screenSharing
        - roomPersistence
        - voiceLimitations

